name: Docker Image Elasticsearch
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 6 AM Daily
  push:
    paths:
      - elasticsearch/**
      - .github/workflows/elasticsearch.yml

jobs:
  elasticsearch:
    name: Elasticsearch
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        version:
          - "5"
          - "6"
          - "7.6"
          - "7.7"
          - "7.9"
          - "7.10"
          - "7.12"
          - "7.13"
          - "7.14"
          - "7.15"
          - "7.16"
          - "7.17"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"
          - "8.7"
          - "8.8"
          - "8.9"
          - "8.10"
          - "8.11"
          - "8.12"
          - "8.13"
          - "8.14"
          - "8.15"
          - "8.16"
          - "8.17"
          - "8.18"
          - "8.19"
          - "9.0"
          - "9.1"
          - "9.2"
          - "9.3"
          - "9.4"
          - "9.5"
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: ${{ !env.ACT }}

      - name: Set build-args
        run: |-
          ESCAPED_VERSION="$(echo ${{ matrix.version }} | sed 's/\./\\\./g')"
          ES_VERSION=$(
            docker run --rm gcr.io/go-containerregistry/crane ls docker.elastic.co/elasticsearch/elasticsearch \
            | egrep "^${ESCAPED_VERSION}\.[0-9]+(\.[0-9]+)?\$" | sort -Vr | head -n1
          )
          echo "ES_VERSION=${ES_VERSION}" | tee /dev/stderr >> $GITHUB_ENV

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: elasticsearch
          platforms: ${{ matrix.platform }}
          build-args: ES_VERSION=${{ env.ES_VERSION }}
          outputs: >-
            type=image,"name=ghcr.io/${{ github.repository_owner }}/elasticsearch,${{ secrets.IMAGE_REPOSITORY }}/elasticsearch",push-by-digest=true,name-canonical=true,push=${{ github.ref == 'refs/heads/main' && !env.ACT }}

      - name: Export digest
        if: github.ref == 'refs/heads/main' && !env.ACT
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && !env.ACT
        with:
          name: digests-elasticsearch-${{ matrix.version }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: elasticsearch
    if: github.ref == 'refs/heads/main' && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "5"
          - "6"
          - "7.6"
          - "7.7"
          - "7.9"
          - "7.10"
          - "7.12"
          - "7.13"
          - "7.14"
          - "7.15"
          - "7.16"
          - "7.17"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"
          - "8.7"
          - "8.8"
          - "8.9"
          - "8.10"
          - "8.11"
          - "8.12"
          - "8.13"
          - "8.14"
          - "8.15"
          - "8.16"
          - "8.17"
          - "8.18"
          - "8.19"
          - "9.0"
          - "9.1"
          - "9.2"
          - "9.3"
          - "9.4"
          - "9.5"
    steps:
      - uses: actions/download-artifact@v8
        if: ${{ !env.ACT }}
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-elasticsearch-${{ matrix.version }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ !env.ACT }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: ${{ !env.ACT }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish manifests
        if: ${{ !env.ACT }}
        working-directory: ${{ runner.temp }}/digests
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/elasticsearch
          DOCKERHUB_IMAGE: ${{ secrets.IMAGE_REPOSITORY }}/elasticsearch
          VERSION: ${{ matrix.version }}
        run: |
          digests=(*)
          if [[ ${#digests[@]} -ne 2 ]]; then
            echo "Expected one digest from each architecture" >&2
            exit 1
          fi
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            sources=()
            for digest in *; do
              sources+=("${image}@sha256:${digest}")
            done
            docker buildx imagetools create --tag "${image}:${VERSION}" "${sources[@]}"
          done
